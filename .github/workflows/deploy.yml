name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Trigger production deploy (launchd)
        run: |
          # 本番は /Users/hiroyuki/clapbot-prod に別 clone があり、
          # launchctl 配下の com.user.clapbot で `npm run start -- -p 3100` として常駐。
          # 通常は com.user.clapbot-deploy が 120秒間隔で .deploy/deploy.sh を実行して
          # main の更新を pull → build → launchctl reload している。
          # Actions では lint/test 通過後に同じスクリプトを即時実行して push 経由で反映を早める。
          /Users/hiroyuki/clapbot-prod/.deploy/deploy.sh

      - name: Health check
        run: |
          # launchctl reload 後に next-server が listen するまで少し待つ
          for i in {1..15}; do
            if curl -fsS http://localhost:3100/api/health | grep -q '"ok"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3100/api/health | grep -q '"ok"' \
            || (echo "✗ /api/health failed"; tail -50 /tmp/clapbot.err.log; exit 1)
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/files)
          if [ "$status" != "401" ]; then
            echo "✗ /api/files unauth check expected 401, got $status"
            tail -50 /tmp/clapbot.err.log
            exit 1
          fi
          echo "✓ health checks passed (api/health ok, api/files auth=401)"
